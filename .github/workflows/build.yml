name: Build

# Every push builds the firmware. A push to main also publishes the web installer (GitHub Pages) with that build;
# a tag like v1.2.0 also attaches the binaries to a GitHub release.
# The version string is the tag name on a tag build, else `git describe`. It goes into the firmware (-DFW_VERSION, which the
# device reports over Improv Serial) and into the installer manifest, and the two must match for the installer to tell
# "same version" from "update".
# The binaries get a SHA256SUMS.txt and a signed build provenance attestation (Sigstore, stored by GitHub): anyone can
# check that a .bin was built here from this repository with `gh attestation verify phosphor.bin -R melihkoray/phosphor`.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      id-token: write           # the attestation's signing certificate
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags, for git describe

      - name: Version
        id: version
        run: |
          last="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          elif [[ -n "$last" ]] && git diff --quiet "$last" HEAD -- firmware libraries assets tools/pack_assets.py build.sh; then
            # Only the docs, README or media changed since the last release: the firmware is the same, so keep that
            # release's version. A "v2.0.0-3-g1a2b3c4" build would never see update notices (they need x.y.z).
            version="$last"
          else
            version="$(git describe --tags --always)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Host tests of the screen texts
        run: |
          python3 tools/test_check_i18n.py
          g++ -std=c++17 -O2 -Wall -Wextra -Wformat=2 -o /tmp/lang_test firmware/test/lang_test.cpp firmware/src/boards/touch349/gadget/Lang*.cpp
          /tmp/lang_test

      - name: Build
        run: ./build.sh
        env:
          PHOSPHOR_VERSION: ${{ steps.version.outputs.version }}

      - name: Collect the flash parts
        run: |
          mkdir -p out
          cp build/firmware.ino.bootloader.bin out/bootloader.bin
          cp build/firmware.ino.partitions.bin out/partitions.bin
          cp "$(find ~/.arduino15/packages/esp32/hardware/esp32 -name boot_app0.bin | head -1)" out/boot_app0.bin
          cp build/firmware.ino.bin out/phosphor.bin
          cp build/assets.bin out/assets.bin
          ls -l out

      - name: Checksums
        run: cd out && sha256sum *.bin | tee SHA256SUMS.txt

      - name: Attest that the binaries were built here
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: out/*.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: docs/firmware
      - name: Stamp the version into the manifest
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: sed -i "s|__VERSION__|${VERSION}|" docs/manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: out
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.bin out/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
